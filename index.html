<script>
// ===== PARTE 2 — DADOS E CÁLCULOS =====
const APP_VERSION = 'v3.5', APP_BUILD = '03/11/2026'; // sobe a cada alteração do app
const KEY = 'financas_app_v1';
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MES3 = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

function estadoVazio() {
  return {
    cfg: { fech: 19, venc: 26, limite: 0, reserva: 500, modo: 'Média histórica', cartao: 'Nubank Cartão' },
    pj: { mesInicial: '', saldo: '', receita: '', gasto: '', parcelas: '', fatura: '' },
    agenda: [], metas: [], contas: [], faturas: [], receitas: [], descontos: [], emprestimos: [], orc: [], regras: [], lanc: [],
    freq: { 'Mensal': 1, 'Quinzenal': 2, 'Semanal': 4.333333, 'Anual': 0.0833333, 'Única': 0 },
    listas: { meios: [], tipos: [], cats: [], contas: [] },
    gastoCats: [], atualizado: '', ultimoBackup: '',
    rev: { meses: '', itens: [] },
    sim: { extra: 0, reaj: 0, usarRev: 'Sim', corte: 0, aporteMes: '', aporteValor: 0 }
  };
}

let S = carregar();
function carregar() {
  try { const t = localStorage.getItem(KEY); if (t) return Object.assign(estadoVazio(), JSON.parse(t)); } catch (e) {}
  return estadoVazio();
}
function salvar() { S.atualizado = new Date().toISOString(); localStorage.setItem(KEY, JSON.stringify(S)); if (typeof agendarSync === 'function') agendarSync(); }

// ---------- utilidades ----------
const num = v => { if (v === '' || v == null) return 0; const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const numOuVazio = v => (v === '' || v == null) ? '' : num(v);
const serialISO = v => { const n = num(v); if (!n) return ''; return new Date(Date.UTC(1899, 11, 30) + Math.round(n) * 864e5).toISOString().slice(0, 10); };
const D = iso => { const [y, m, d] = String(iso).split('-').map(Number); return new Date(y, m - 1, d || 1); };
const ISO = dt => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
const hoje = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const iniMes = dt => new Date(dt.getFullYear(), dt.getMonth(), 1);
const fimMes = dt => new Date(dt.getFullYear(), dt.getMonth() + 1, 0);
const addMes = (dt, n) => new Date(dt.getFullYear(), dt.getMonth() + n, 1);
const chaveMes = dt => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0');
const brl = v => (v < 0 ? '-' : '') + 'R$ ' + Math.abs(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dataBR = iso => iso ? D(iso).toLocaleDateString('pt-BR') : '';
const mesBR = dt => MES3[dt.getMonth()] + '/' + String(dt.getFullYear()).slice(2);
const r2 = v => Math.round(v * 100) / 100;
const uid = () => Math.random().toString(36).slice(2, 10);

// ---------- importação da planilha ----------
function importarTexto(txt) {
  const linhas = txt.replace(/\r/g, '').split('\n').map(l => l.trim().replace(/^"|"$/g, '')).filter(l => l);
  if (!linhas.some(l => l.startsWith('FINAPP|'))) throw new Error('Texto não reconhecido. Copie o conteúdo da aba "Exportar App" (clique em A1 e aperte Ctrl+Shift+End).');
  const N = estadoVazio();
  const recs = s => (s || '').split('~').map(r => r.split('^'));
  for (const l of linhas) {
    const i = l.indexOf('|'); if (i < 0) continue;
    const tipo = l.slice(0, i), resto = l.slice(i + 1), f = resto.split('|');
    switch (tipo) {
      case 'CFG': N.cfg = { fech: num(f[0]), venc: num(f[1]), limite: num(f[2]), reserva: num(f[3]), modo: f[4] || 'Média histórica', cartao: f[5] || 'Nubank Cartão' }; break;
      case 'PJ': N.pj = { mesInicial: serialISO(f[0]), saldo: numOuVazio(f[1]), receita: numOuVazio(f[2]), gasto: numOuVazio(f[3]), parcelas: numOuVazio(f[4]), fatura: numOuVazio(f[5]) }; break;
      case 'C': N.contas = recs(resto).filter(r => r[0]).map(r => ({ nome: r[0], tipo: r[1] || '', saldoIni: num(r[2]) })); break;
      case 'F': N.faturas = recs(resto).filter(r => r[0]).map(r => ({ nome: r[0], valorFixo: numOuVazio(r[1]), origem: r[2], venc: serialISO(r[3]) })); break;
      case 'REC': N.receitas = recs(resto).filter(r => r[0]).map(r => ({ desc: r[0], tipo: r[1], conta: r[2], valor: num(r[3]), freq: r[4] || 'Mensal', dia: numOuVazio(r[5]), inicio: serialISO(r[6]), fim: serialISO(r[7]), ativa: r[8] || 'Sim' })); break;
      case 'FREQ': N.freq = {}; recs(resto).filter(r => r[0]).forEach(r => N.freq[r[0]] = num(r[1])); break;
      case 'DESC': N.descontos = recs(resto).filter(r => r[0] && r[0] !== '0').map(r => ({ nome: r[0], tipo: r[1], pct: numOuVazio(r[2]), fixo: numOuVazio(r[3]) })); break;
      case 'EMP': N.emprestimos = recs(resto).filter(r => r[0]).map(r => ({ inst: r[0], tipo: r[1], contrato: r[2], primeira: serialISO(r[3]), valor: num(r[4]), taxa: num(r[5]), n: num(r[6]), pagas: num(r[7]), parcela: num(r[8]), dia: numOuVazio(r[9]), folha: r[10] || 'Não' })); break;
      case 'ORC': N.orc = recs(resto).filter(r => r[0]).map(r => ({ cat: r[0], valor: num(r[1]) })); break;
      case 'LM': N.listas.meios = resto.split('~').filter(Boolean); break;
      case 'LT': N.listas.tipos = resto.split('~').filter(Boolean); break;
      case 'LC': N.listas.cats = resto.split('~').filter(Boolean); break;
      case 'LCT': N.listas.contas = resto.split('~').filter(Boolean); break;
      case 'GC': N.gastoCats = resto.split('~').filter(Boolean); break;
      case 'R': N.regras = recs(resto).filter(r => r[0]).map(r => ({ k: r[0], cat: r[1], tipo: r[2] })); break;
      case 'L': N.lanc.push({ id: uid(), data: serialISO(f[0]), desc: f[1], valor: num(f[2]), conta: f[3], meio: f[4], tipo: f[5], cat: f[6], origem: f[7] }); break;
    }
  }
  N.rev = S.rev; N.sim = S.sim; N.agenda = S.agenda || []; N.metas = S.metas || []; N.ultimoBackup = S.ultimoBackup || ''; // dados que vivem só no app: a importação não apaga
  S = N; salvar();
  return N.lanc.length;
}

// ---------- regras de categoria (vale a ÚLTIMA palavra-chave encontrada) ----------
function sugerirCategoria(desc) {
  const d = String(desc).toLowerCase(); let achou = null;
  for (const r of S.regras) if (r.k && d.includes(r.k.toLowerCase())) achou = r;
  return achou;
}

// ---------- contas ----------
const saldoConta = nome => r2((S.contas.find(c => c.nome === nome)?.saldoIni || 0) + S.lanc.filter(l => l.conta === nome).reduce((a, l) => a + l.valor, 0));
const saldoTotal = () => r2(S.contas.reduce((a, c) => a + saldoConta(c.nome), 0));

// ---------- cartão e faturas ----------
function faturaDaCompra(iso) {
  const d = D(iso), fech = S.cfg.fech, venc = S.cfg.venc;
  let mFech = d.getMonth() + (d.getDate() > fech ? 1 : 0);
  const mVenc = mFech + (venc > fech ? 0 : 1);
  const dv = new Date(d.getFullYear(), mVenc, venc);
  const df = new Date(d.getFullYear(), mFech, fech);
  return { venc: ISO(dv), fech: ISO(df), nome: MESES[dv.getMonth()], ano: dv.getFullYear() };
}
function origemParaCompra(iso) {
  const f = faturaDaCompra(iso);
  let fat = S.faturas.find(x => x.venc === f.venc);
  if (!fat) {
    const usado = S.faturas.some(x => x.origem === 'Extrato ' + f.nome);
    fat = { nome: f.nome + (usado ? ' ' + f.ano : ''), valorFixo: '', origem: 'Extrato ' + f.nome + (usado ? ' ' + f.ano : ''), venc: f.venc };
    S.faturas.push(fat);
  }
  return fat.origem;
}
const fechamentoDe = vencISO => { const v = D(vencISO); const m = v.getMonth() - (S.cfg.venc > S.cfg.fech ? 0 : 1); return ISO(new Date(v.getFullYear(), m, S.cfg.fech)); };
const totalPagamentosFatura = () => -S.lanc.filter(l => l.cat === 'Pagamento de fatura' && l.conta !== S.cfg.cartao).reduce((a, l) => a + l.valor, 0);
function faturasCalc() {
  const lista = [...S.faturas].sort((a, b) => a.venc.localeCompare(b.venc));
  let resta = totalPagamentosFatura(); const h = hoje();
  return lista.map(f => {
    const valor = f.valorFixo !== '' && f.valorFixo != null ? num(f.valorFixo) : r2(-S.lanc.filter(l => l.origem === f.origem).reduce((a, l) => a + l.valor, 0));
    const pago = r2(Math.min(valor, Math.max(0, resta))); resta -= valor;
    const aberto = r2(valor - pago);
    const sit = aberto <= 0 ? 'PAGA' : pago > 0 ? 'PARCIAL' : D(f.venc) < h ? 'VENCIDA' : 'A VENCER';
    return { ...f, valor, pago, aberto, sit, fech: fechamentoDe(f.venc) };
  });
}
function cartaoResumo() {
  const fs = faturasCalc(), aberto = r2(fs.reduce((a, f) => a + f.aberto, 0)), lim = num(S.cfg.limite);
  return { aberto, limite: lim, usado: lim ? aberto / lim : 0, disponivel: r2(lim - aberto), sit: aberto > lim ? 'ESTOURADO' : 'OK' };
}
function cicloInfo() {
  const fech = S.cfg.fech;
  return { melhorDia: fech >= 28 ? 1 : fech + 1, compraHoje: faturaDaCompra(ISO(hoje())) };
}

// ---------- parcelas já contratadas no cartão (texto "- 2/5" ou "Parcela 2/5" no fim da descrição) ----------
const RE_PARC = /(?:\bparc(?:ela)?\.?\s*|\s[-–]\s*)(\d{1,2})\s*\/\s*(\d{1,2})\s*$/i;
function parcelasFuturas() {
  const g = {};
  S.lanc.filter(l => l.valor < 0 && l.conta === S.cfg.cartao).forEach(l => {
    const desc = String(l.desc).trim(), m = RE_PARC.exec(desc);
    if (!m) return;
    const n = +m[1], t = +m[2];
    if (n < 1 || t < 2 || t > 60 || n > t) return;
    const base = desc.replace(RE_PARC, '').replace(/[\s\-–·]+$/, '').trim(), k = base.toLowerCase() + '|' + t + '|' + r2(-l.valor);
    if (!g[k] || n > g[k].n) g[k] = { desc: base || desc, n, t, valor: r2(-l.valor), data: l.data };
  });
  const out = [];
  Object.values(g).forEach(x => {
    const d0 = D(x.data);
    for (let n = x.n + 1; n <= x.t; n++) {
      const iso = dataDia(new Date(d0.getFullYear(), d0.getMonth() + (n - x.n), 1), d0.getDate());
      out.push({ desc: x.desc, n, t: x.t, valor: x.valor, data: iso, venc: faturaDaCompra(iso).venc });
    }
  });
  return out.sort((a, b) => a.venc.localeCompare(b.venc));
}
function tabelaParcelasCartao() {
  const P = parcelasFuturas(); if (!P.length) return '';
  const g = {};
  P.forEach(p => { const k = p.desc + '|' + p.t + '|' + p.valor; const e = g[k] = g[k] || { ...p, rest: 0, prox: p.venc }; e.rest++; e.ate = p.venc; });
  const L = Object.values(g), total = L.reduce((a, e) => a + e.rest * e.valor, 0);
  return `<h2>Parcelas já contratadas no cartão</h2>
  <div class="rolar"><table class="tabela"><tr><th>Compra</th><th class="n">Restantes</th><th class="n">Valor da parcela</th><th class="n">Total a pagar</th><th class="n">Próxima fatura</th><th class="n">Última fatura</th></tr>
  ${L.map(e => `<tr><td>${esc(e.desc)}</td><td class="n">${e.rest} de ${e.t}</td><td class="n">${brl(e.valor)}</td><td class="n">${brl(e.rest * e.valor)}</td><td class="n">${dataBR(e.prox)}</td><td class="n">${dataBR(e.ate)}</td></tr>`).join('')}
  <tr class="total"><td>Total</td><td></td><td></td><td class="n">${brl(total)}</td><td colspan="2"></td></tr></table></div>
  <p class="dica">Detectado pelo texto "- 2/5" ou "Parcela 2/5" no fim da descrição. Estas parcelas entram na Projeção, na fatura do mês em que vencem.</p>`;
}

// ---------- receitas e descontos ----------
const fatorFreq = f => S.freq[f] ?? 0;
const receitaMensal = r => r.desc ? num(r.valor) * fatorFreq(r.freq) : 0;
const salarioBruto = () => S.receitas.filter(r => r.tipo === 'Salário' && r.ativa !== 'Não').reduce((a, r) => a + receitaMensal(r), 0);
const valorDesconto = d => d.pct !== '' && d.pct != null ? salarioBruto() * num(d.pct) : num(d.fixo);
const consignadoFolha = () => S.emprestimos.filter(e => e.inst && e.folha === 'Sim' && (e.n - e.pagas) > 0).reduce((a, e) => a + num(e.parcela), 0);
const totalDescontosSemConsig = () => S.descontos.reduce((a, d) => a + valorDesconto(d), 0);
const salarioLiquido = () => salarioBruto() - totalDescontosSemConsig() - consignadoFolha();

// ---------- empréstimos ----------
function empCalc(e) {
  const rest = Math.max(0, num(e.n) - num(e.pagas)), parc = num(e.parcela);
  const total = num(e.n) * parc;
  let quit = ''; if (e.primeira && e.n) { const p = D(e.primeira); quit = ISO(new Date(p.getFullYear(), p.getMonth() + num(e.n) - 1, p.getDate())); }
  return { rest, saldo: rest * parc, total, juros: total - num(e.valor), sit: rest <= 0 ? 'Quitado' : 'Em aberto', quit };
}

// ---------- gastos por categoria ----------
function gastoCatMes(cat, dt) {
  const k = chaveMes(dt);
  return -S.lanc.filter(l => l.cat === cat && l.data.slice(0, 7) === k).reduce((a, l) => a + l.valor, 0);
}
function mediaCategoria(cat, meses = 6) {
  const vals = []; const base = iniMes(hoje());
  for (let i = meses - 1; i >= 0; i--) { const v = gastoCatMes(cat, addMes(base, -i)); if (v !== 0) vals.push(v); }
  return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
}
const catsGasto = () => (S.gastoCats.length ? S.gastoCats : S.listas.cats.slice(0, 14));
function tabelaMedias() {
  return catsGasto().map(c => ({ cat: c, media: mediaCategoria(c), orc: num(S.orc.find(o => o.cat === c)?.valor) }));
}
const gastoMedioTotal = () => tabelaMedias().filter(t => t.cat !== 'Empréstimos').reduce((a, t) => a + t.media, 0);
const orcTotal = () => S.orc.reduce((a, o) => a + num(o.valor), 0);

// ---------- projeção 24 meses ----------
function projecao() {
  const P = S.pj, fs = faturasCalc();
  const mes0 = P.mesInicial ? iniMes(D(P.mesInicial)) : iniMes(hoje());
  const faturasVencidas = fs.filter(f => D(f.venc) < mes0).reduce((a, f) => a + f.aberto, 0);
  const saldoIni = P.saldo !== '' ? num(P.saldo) : saldoTotal() - faturasVencidas;
  const gasto = P.gasto !== '' ? num(P.gasto) : (S.cfg.modo === 'Orçamento' ? orcTotal() : gastoMedioTotal());
  const descSemConsig = totalDescontosSemConsig();
  const pf = {}; parcelasFuturas().forEach(x => { const k = x.venc.slice(0, 7); pf[k] = (pf[k] || 0) + x.valor; });
  const linhas = []; let saldo = saldoIni;
  for (let i = 0; i < 24; i++) {
    const m = addMes(mes0, i), fm = fimMes(m);
    const rec = P.receita !== '' ? num(P.receita) : S.receitas.filter(r => r.ativa !== 'Não' && (!r.inicio || D(r.inicio) <= fm) && (!r.fim || D(r.fim) >= m)).reduce((a, r) => a + receitaMensal(r), 0) - descSemConsig;
    const parc = P.parcelas !== '' ? num(P.parcelas) : S.emprestimos.filter(e => e.inst && (!e.primeira || D(e.primeira) <= fm) && (num(e.n) - num(e.pagas)) >= i + 1).reduce((a, e) => a + num(e.parcela), 0);
    const fat = P.fatura !== '' ? num(P.fatura) : fs.filter(f => { const v = D(f.venc); return v >= m && v <= fm; }).reduce((a, f) => a + f.aberto, 0) + (pf[chaveMes(m)] || 0);
    const res = rec - gasto - parc - fat, ini = saldo; saldo = ini + res;
    linhas.push({ mes: m, ini, rec, gasto, parc, fat, res, fim: saldo, st: saldo < 0 ? 'NEGATIVO' : saldo < num(S.cfg.reserva) ? 'ATENÇÃO' : 'OK' });
  }
  return { linhas, saldoIni, gasto, final: saldo, menor: Math.min(...linhas.map(l => l.fim)), negativos: linhas.filter(l => l.fim < 0).length };
}

// ---------- calendário e disponibilidade (previsões não alteram saldos) ----------
let mesAgenda = chaveMes(hoje()), agendaRefPendente = '';
const dataDia = (m,dia) => ISO(new Date(m.getFullYear(),m.getMonth(),Math.min(Math.max(1,num(dia)),fimMes(m).getDate())));
function eventosAgenda(inicio,fim){
  const ev=[];
  let mudou=false;
  for(const item of [...S.receitas,...S.emprestimos])if(!item.agendaId){item.agendaId=uid();mudou=true;}
  if(mudou)salvar();
  const incluir=e=>{if(e.data && e.data<=ISO(fim) && e.data>=ISO(inicio)){
    e.lanc=S.lanc.find(l=>l.agendaRef===e.id);
    e.realizado=!!e.lanc && e.lanc.data<=ISO(hoje()); ev.push(e);
  }};
  for(const a of (S.agenda||[])) incluir({...a,id:'manual:'+a.id,fonte:'Manual'});
  for(const f of faturasCalc()) if(f.aberto>0 && f.venc<=ISO(fim))
    ev.push({id:'fat:'+f.venc+':'+f.origem,data:f.venc,desc:'Fatura '+f.nome,valor:-f.aberto,fonte:'Cartão',origem:f.origem,realizado:false});
  for(let m=iniMes(inicio);m<=fim;m=addMes(m,1)){
    S.receitas.forEach((r,i)=>{
      if(!r.desc || r.ativa==='Não')return;
      // Sem dia ou frequência exata, não inventar datas a partir de médias mensais.
      let data='';
      if(r.freq==='Mensal' && num(r.dia)>=1 && num(r.dia)<=31)data=dataDia(m,r.dia);
      if(r.freq==='Única' && r.inicio && chaveMes(D(r.inicio))===chaveMes(m))data=r.inicio;
      if(!data || (r.inicio && data<r.inicio) || (r.fim && data>r.fim))return;
      let valor=num(r.valor);
      if(r.tipo==='Salário'){
        const base=salarioBruto();
        const proporcao=base>0?receitaMensal(r)/base:0;
        const folha=S.emprestimos.filter(e=>e.inst && e.folha==='Sim' && num(e.n)>num(e.pagas)).reduce((a,e)=>{
          if(!e.primeira)return a+num(e.parcela);
          const parcela=(m.getFullYear()-D(e.primeira).getFullYear())*12+m.getMonth()-D(e.primeira).getMonth();
          return a+(parcela>=num(e.pagas) && parcela<num(e.n)?num(e.parcela):0);
        },0);
        valor-=proporcao*(totalDescontosSemConsig()+folha);
      }
      incluir({id:'rec:'+r.agendaId+':'+data,data,desc:r.desc,valor:r2(valor),fonte:'Receita',salario:r.tipo==='Salário',conta:r.conta});
    });
    S.emprestimos.forEach((e,i)=>{
      if(!e.inst || e.folha==='Sim' || !e.primeira || num(e.n)<=num(e.pagas))return;
      const primeira=D(e.primeira), n=(m.getFullYear()-primeira.getFullYear())*12+m.getMonth()-primeira.getMonth();
      if(n<num(e.pagas) || n>=num(e.n))return;
      incluir({id:'emp:'+e.agendaId+':'+n,data:dataDia(m,num(e.dia)||primeira.getDate()),desc:e.inst+' · parcela '+(n+1)+'/'+e.n,valor:-num(e.parcela),fonte:'Empréstimo'});
    });
  }
  return ev.sort((a,b)=>a.data.localeCompare(b.data)||a.valor-b.valor);
}
function disponibilidade(){
  const h=hoje(), horizonte=addMes(h,13);
  const datas=[ISO(addMes(h,-1)),...(S.agenda||[]).map(a=>a.data),...S.emprestimos.map(e=>e.primeira).filter(Boolean)];
  const eventos=eventosAgenda(D(datas.sort()[0]),horizonte);
  const salario=eventos.find(e=>e.salario && !e.realizado && e.data>=ISO(h));
  const fim=salario?D(salario.data):null;
  // Somente saldo em contas de dinheiro, sem cartão e sem lançamentos futuros.
  const saldo=r2(S.contas.filter(c=>c.nome!==S.cfg.cartao).reduce((a,c)=>a+num(c.saldoIni)+S.lanc.filter(l=>l.conta===c.nome && l.data<=ISO(h)).reduce((b,l)=>b+num(l.valor),0),0));
  const pendentes=fim?eventos.filter(e=>!e.realizado && e.valor<0 && e.data<=ISO(fim)):[];
  const compromissos=r2(-pendentes.reduce((a,e)=>a+e.valor,0));
  const dias=fim?Math.max(1,Math.round((Date.UTC(fim.getFullYear(),fim.getMonth(),fim.getDate())-Date.UTC(h.getFullYear(),h.getMonth(),h.getDate()))/864e5)+1):0;
  const reserva=Math.max(0,num(S.cfg.reserva)), variaveis=Math.max(0,num(S.cfg.gastoDiario))*dias;
  return {salario,saldo,compromissos,reserva,variaveis,dias,livre:r2(saldo-compromissos-reserva-variaveis),pendentes};
}
function blocoDisponivel(){
 const d=disponibilidade();
 return `<h2>Até o próximo salário</h2><div class="grid">
 <div class="card kpi"><div class="rot">Disponível estimado</div><div class="val ${d.salario?cor(d.livre):''}">${d.salario?brl(d.livre):'—'}</div><div class="det">${d.salario?'Até '+dataBR(d.salario.data)+' · incluindo vencimentos desse dia':'Cadastre o dia de uma receita mensal do tipo Salário'}</div></div>
 <div class="card kpi"><div class="rot">Compromissos pendentes</div><div class="val neg">${d.salario?brl(d.compromissos):'—'}</div><div class="det">Faturas, parcelas fora da folha e contas agendadas</div></div>
 <div class="card kpi"><div class="rot">Reserva protegida</div><div class="val">${brl(d.reserva)}</div><div class="det">Valor definido em Configurações</div></div>
 <div class="card kpi"><div class="rot">Próximo salário previsto</div><div class="val pos">${d.salario?brl(d.salario.valor):'—'}</div><div class="det">Líquido previsto · não somado ao disponível atual</div></div></div>
 <div class="card" style="margin-top:14px"><p class="dica">Estimativa = dinheiro registrado até hoje − compromissos até o salário − reserva − gastos diários previstos. Não inclui novas compras futuras no cartão. Concilie pagamentos e recebimentos já lançados no calendário para evitar duplicidade. Consignados são descontados da receita, sem nova saída.</p><div class="linha-bts"><button class="bt sec" onclick="ir('agenda')">Ver calendário e conciliar</button></div></div>`;
}
function moverAgenda(n){mesAgenda=chaveMes(addMes(D(mesAgenda+'-01'),n));render();}
function telaAgenda(){
 const m=D(mesAgenda+'-01'),ev=eventosAgenda(iniMes(m),fimMes(m)).filter(e=>e.data>=ISO(iniMes(m)));
 const dias=[];for(let i=0;i<m.getDay();i++)dias.push('<div class="dia vazio"></div>');

function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2500); }

function ir(t) { telaAtual = t; render(); window.scrollTo(0, 0); }
// Editar uma célula não pode tirar o cursor: se o render vem de um "change" dentro da tela, ele é adiado
// até o clique/tab terminar e o foco volta para o mesmo campo.
let ptrDown = false, renderPend = false;
document.addEventListener('pointerdown', () => { ptrDown = true; }, true);
document.addEventListener('pointerup', () => { ptrDown = false; if (renderPend) setTimeout(() => { if (renderPend) { renderPend = false; renderComFoco(); } }, 60); }, true);
function render() {
  const ev = window.event;
  if (ev && ev.type === 'change' && ev.target && $('tela').contains(ev.target)) { if (ptrDown) renderPend = true; else setTimeout(renderComFoco, 0); return; }
  renderAgora();
}
function renderComFoco() {
  renderPend = false;
  const t = $('tela'), a = document.activeElement, campos = () => [...t.querySelectorAll('input,select,textarea')];
  let idx = -1, ss = null, se = null;
  if (a && t.contains(a)) { idx = campos().indexOf(a); try { ss = a.selectionStart; se = a.selectionEnd; } catch (e) {} }
  const y = window.scrollY; renderAgora(); window.scrollTo(0, y);
  if (idx >= 0) { const n = campos()[idx]; if (n) { n.focus({ preventScroll: true }); try { if (ss != null) n.setSelectionRange(ss, se); } catch (e) {} } }
}
function renderAgora() {
  $('nav').innerHTML = TELAS.map(([k, i, n]) => `<button aria-current="${k === telaAtual ? 'page' : 'false'}" class="${k === telaAtual ? 'ativo' : ''}" onclick="ir('${k}')"><span>${i}</span>${n}</button>`).join('');
  $('atualizado').textContent = textoRodape();
  document.title = 'Minhas Finanças ' + APP_VERSION;
  if (!S.lanc.length && !S.contas.length && telaAtual !== 'config' && telaAtual !== 'metas') {

    return;
  }
  ({ agenda: telaAgenda, metas: telaMetas, painel: telaPainel, lanc: telaLanc, contas: telaContas, receitas: telaReceitas, emprest: telaEmprest, rev: telaRev, proj: telaProj, sim: telaSim, config: telaConfig })[telaAtual]();
}

// ---------- ALERTAS DO PAINEL ----------
function alertasPainel() {
  const A = [], h = hoje(), c = cartaoResumo();
  if (c.limite > 0) {
    const u = c.usado * 100;
    if (u >= 100) A.push({ n: 'neg', t: `Limite do cartão estourado: ${brl(c.aberto)} de ${brl(c.limite)} (${u.toFixed(0)}%).`, a: ['Ver cartão', "ir('contas')"] });
    else if (u >= 80) A.push({ n: 'warn', t: `Cartão em ${u.toFixed(0)}% do limite — restam ${brl(c.disponivel)}.`, a: ['Ver cartão', "ir('contas')"] });
  }
  faturasCalc().filter(f => f.aberto > 0).forEach(f => {
    const dias = Math.round((D(f.venc) - h) / 864e5);
    if (dias < 0) A.push({ n: 'neg', t: `Fatura ${f.nome} (${brl(f.aberto)}) venceu há ${-dias} dia(s).`, a: ['Pagar', "ir('contas')"] });
    else if (dias <= 5) A.push({ n: 'warn', t: `Fatura ${f.nome}: ${brl(f.aberto)} vence ${dias === 0 ? 'hoje' : dias === 1 ? 'amanhã' : 'em ' + dias + ' dias'} (${dataBR(f.venc)}).`, a: ['Ver faturas', "ir('contas')"] });
  });
  const m0 = iniMes(h);
  catsGasto().forEach(ct => {
    const o = num(S.orc.find(x => x.cat === ct)?.valor); if (!(o > 0)) return;
    const v = gastoCatMes(ct, m0);
    if (v > o) A.push({ n: 'neg', t: `${ct}: ${brl(v)} gastos neste mês, acima do orçamento de ${brl(o)}.` });
    else if (v >= o * 0.8) A.push({ n: 'warn', t: `${ct}: ${(v / o * 100).toFixed(0)}% do orçamento do mês já usado (${brl(v)} de ${brl(o)}).` });
  });
  try { const d = disponibilidade(); if (d.salario && d.livre < 0) A.push({ n: 'neg', t: `Até o próximo salário (${dataBR(d.salario.data)}) faltam ${brl(-d.livre)} para cobrir compromissos, reserva e gastos diários.` }); } catch (e) {}
  S.contas.filter(x => x.nome !== S.cfg.cartao && saldoConta(x.nome) < 0).forEach(x => A.push({ n: 'neg', t: `Conta ${x.nome} está negativa: ${brl(saldoConta(x.nome))}.`, a: ['Ver contas', "ir('contas')"] }));
  try {
    S.metas.filter(m => m.tipo === 'Teto de gastos' && m.cat && num(m.alvo) > 0).forEach(m => { const t = tetoInfo(m); if (t.st === 'ESTOURADO') A.push({ n: 'neg', t: `Meta "${m.nome}": ${brl(t.gasto)} em ${m.cat} neste mês, acima do teto de ${brl(t.teto)}.`, a: ['Ver metas', "ir('metas')"] }); else if (t.st === 'ATENÇÃO') A.push({ n: 'warn', t: `Meta "${m.nome}": ${(t.pct * 100).toFixed(0)}% do teto de ${m.cat} já usado neste mês.`, a: ['Ver metas', "ir('metas')"] }); });
    if (S.metas.some(m => ehPoupanca(m.tipo))) { const b = baseMetas(), R = simularMetas(b, 0); R.gs.forEach(g => { if (metaInfo(g, R.mes0).st === 'Atrasada') A.push({ n: 'warn', t: `Meta "${g.m.nome}" não fecha no prazo com a sobra projetada.`, a: ['Ver metas', "ir('metas')"] }); }); }
  } catch (e) {}
  if (S.lanc.length) {
    const dias = S.ultimoBackup ? Math.floor((h - D(S.ultimoBackup)) / 864e5) : null;
    if (dias === null || dias >= 7) A.push({ n: 'info', t: dias === null ? 'Você ainda não fez backup dos dados deste navegador.' : `Último backup há ${dias} dias.`, a: ['Fazer backup agora', 'exportarBackup()'] });
  }
  return A;
}
function blocoAlertas() {
  const A = alertasPainel();
  return A.length ? `<div>${A.map(x => `<div class="alerta ${x.n}"><span>${esc(x.t)}</span>${x.a ? `<button class="bt sec" onclick="${x.a[1]}">${x.a[0]}</button>` : ''}</div>`).join('')}</div>` : '';
}

function telaPainel() {
  const c = cartaoResumo(), p = projecao(), m = D(mesPainel + '-01');
  const doMes = S.lanc.filter(l => l.data.slice(0, 7) === mesPainel);
  const catsG = catsGasto();
  const gastoMes = catsG.reduce((a, ct) => a + gastoCatMes(ct, m), 0);
  const entradas = doMes.filter(l => l.valor > 0 && l.conta !== S.cfg.cartao && l.cat !== 'Transferência').reduce((a, l) => a + l.valor, 0);
  const porCat = catsG.map(ct => ({ ct, v: gastoCatMes(ct, m), o: num(S.orc.find(o => o.cat === ct)?.valor) })).filter(x => x.v !== 0).sort((a, b) => b.v - a.v);
  const max = Math.max(1, ...porCat.map(x => Math.max(x.v, x.o)));
  const meses = [...new Set(S.lanc.map(l => l.data.slice(0, 7)).concat(chaveMes(hoje())))].sort().reverse();
  const hist = []; for (let i = 5; i >= 0; i--) { const mm = addMes(iniMes(hoje()), -i); hist.push({ m: mm, v: catsG.reduce((a, ct) => a + gastoCatMes(ct, mm), 0) }); }
  const hmax = Math.max(1, ...hist.map(h => h.v));
  const prox = faturasCalc().filter(f => f.aberto > 0)[0];
  $('tela').innerHTML = `
  ${blocoAlertas()}
  ${blocoDisponivel()}
  <h2>Resumo</h2>
  <div class="grid">
    <div class="card kpi"><div class="rot">Saldo em contas</div><div class="val ${cor(saldoTotal())}">${brl(saldoTotal())}</div><div class="det">${S.contas.filter(x => saldoConta(x.nome) !== 0).map(x => x.nome + ': ' + brl(saldoConta(x.nome))).join(' · ')}</div></div>
    <div class="card kpi"><div class="rot">Fatura em aberto</div><div class="val">${brl(c.aberto)}</div><div class="det">${prox ? 'Próxima: ' + brl(prox.aberto) + ' em ' + dataBR(prox.venc) : 'Nada a pagar'}</div></div>
    <div class="card kpi"><div class="rot">Limite disponível</div><div class="val ${cor(c.disponivel)}">${brl(c.disponivel)}</div><div class="det">${(c.usado * 100).toFixed(1)}% de ${brl(c.limite)} usado</div></div>
    <div class="card kpi"><div class="rot">Saldo em 24 meses</div><div class="val ${cor(p.final)}">${brl(p.final)}</div><div class="det">Pior mês: ${brl(p.menor)} · ${p.negativos} no vermelho</div></div>
  </div>
  ${rotaVermelho(p)}
  ${blocoMetasResumo()}
  <h2>Gastos do mês</h2>
  <div class="card">
    <div class="filtros"><select onchange="mesPainel=this.value;render()">${meses.map(k => `<option value="${k}" ${k === mesPainel ? 'selected' : ''}>${MESES[+k.slice(5) - 1]} ${k.slice(0, 4)}</option>`).join('')}</select></div>
    <div class="grid" style="margin-bottom:10px">
      <div class="kpi"><div class="rot">Gastos</div><div class="val neg">${brl(gastoMes)}</div></div>
      <div class="kpi"><div class="rot">Entradas</div><div class="val pos">${brl(entradas)}</div></div>
    </div>
    ${porCat.map(x => `<div class="barra"><div class="nome">${esc(x.ct)}</div><div class="trilho"><div class="enche ${x.o && x.v > x.o ? 'acima' : ''}" style="width:${Math.max(0, x.v) / max * 100}%"></div></div><div class="v">${brl(x.v)}</div></div>`).join('') || '<p class="dica">Sem gastos neste mês.</p>'}
    <p class="dica">Barra vermelha = passou do orçamento da categoria.</p>
  </div>
  <h2>Últimos 6 meses</h2>
  <div class="card">${hist.map(h => `<div class="barra"><div class="nome">${mesBR(h.m)}</div><div class="trilho"><div class="enche" style="width:${h.v / hmax * 100}%"></div></div><div class="v">${brl(h.v)}</div></div>`).join('')}</div>`;
}

// ---------- IMPORTAR CSV DA FATURA (date,title,amount) ----------
let csvLinhas = [], csvConta = '';
// Conserta UTF-8 lido como Latin-1 ("CrÃ©dito" vira "Crédito"), trecho a trecho
function repararAcentos(t) { return t.replace(/[Â-ô][\u0080-¿]+/g, m => { try { return decodeURIComponent(escape(m)); } catch (e) { return m; } }); }
function parseCSV(txt, delim) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (q) { if (c === '"') { if (txt[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  row.push(cur); rows.push(row);
  return rows.filter(r => r.some(x => x.trim()));
}
function dataCSV(s) {
  s = String(s || '').trim(); let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s), y, mo, d;
  if (m) [, y, mo, d] = m; else if ((m = /^(\d{2})\/(\d{2})\/(\d{4})/.exec(s))) [, d, mo, y] = m; else return '';
  return (+mo >= 1 && +mo <= 12 && +d >= 1 && +d <= 31) ? y + '-' + mo + '-' + d : '';
}
function valorCSV(s) {
  s = String(s ?? '').replace(/R\$/g, '').replace(/\s/g, ''); if (!s) return null;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s); return isFinite(n) ? n : null;
}
function lerCSVArquivo(f) {
  if (!f) return; const r = new FileReader();
  r.onload = () => {
    let t; try { t = new TextDecoder('utf-8', { fatal: true }).decode(r.result); } catch (e) { t = new TextDecoder('windows-1252').decode(r.result); }
    $('csvTxt').value = t;
  };
  r.readAsArrayBuffer(f);
}
function analisarCSV() {
  const txt = repararAcentos(($('csvTxt').value || '').replace(/^﻿/, '').trim());
  csvConta = $('csvConta').value;
  if (!txt) return alert('Cole o conteúdo do CSV ou escolha o arquivo.');
  const prim = txt.split('\n')[0], delim = prim.includes(';') && !prim.includes(',') ? ';' : ',';
  const rows = parseCSV(txt, delim), cab = rows[0].map(c => c.trim().toLowerCase());
  const temCab = cab.some(c => /^(date|data|title|descri|t[ií]tulo|amount|valor)/.test(c));
  const col = (re, def) => { const i = cab.findIndex(c => re.test(c)); return temCab && i >= 0 ? i : def; };
  const iD = col(/^(date|data)/, 0), iT = col(/^(title|descri|t[ií]tulo)/, 1), iV = col(/^(amount|valor)/, 2);
  const usados = new Set(), padrao = S.listas.cats.includes('Outros') ? 'Outros' : '';
  let ignoradas = 0; csvLinhas = [];
  (temCab ? rows.slice(1) : rows).forEach(r => {
    const data = dataCSV(r[iD]), desc = (r[iT] || '').trim(), v = valorCSV(r[iV]);
    if (!data || !desc || v === null) { ignoradas++; return; }
    const valor = r2(-v), d = desc.toLowerCase();
    const igual = l => !usados.has(l.id) && l.conta === csvConta && l.data === data && Math.abs(l.valor - valor) < 0.005;
    const ex = S.lanc.find(l => igual(l) && l.desc.trim().toLowerCase() === d) || S.lanc.find(igual);
    if (ex) usados.add(ex.id);
    const pag = v < 0 && /pagamento/i.test(desc), rg = sugerirCategoria(desc);
    csvLinhas.push({ data, desc, valor, cat: rg ? rg.cat : padrao, tipo: rg && rg.tipo ? rg.tipo : (S.listas.tipos.includes('Gasto') ? 'Gasto' : S.listas.tipos[0] || ''),
      estado: ex ? 'Duplicado' : pag ? 'Pagamento' : 'Novo', sel: !ex && !pag });
  });
  csvLinhas.ignoradas = ignoradas;
  if (!csvLinhas.length) return alert('Não encontrei linhas válidas. O CSV precisa ter data, descrição e valor.');
  modalCSV();
}
function csvSet(i, k, v) { csvLinhas[i][k] = v; modalCSV(); }
function csvTodos(b) { csvLinhas.forEach(x => { x.sel = b; }); modalCSV(); }
function csvVoltar() { csvLinhas = []; modalCSV(); }
function modalCSV() {
  const sc = document.querySelector('#modal .caixa')?.scrollTop || 0;
  if (!csvConta) csvConta = S.cfg.cartao;
  const L = csvLinhas; let corpo;
  if (!L.length) {
    corpo = `<p class="dica">Cole o CSV da fatura (colunas <b>date,title,amount</b>) ou escolha o arquivo. Valores positivos são compras; negativos são pagamentos ou estornos. Nada entra no app antes da sua conferência.</p>
    <label>Arquivo CSV<input type="file" accept=".csv,text/csv,text/plain" onchange="lerCSVArquivo(this.files[0])"></label>
    <label>…ou cole aqui<textarea id="csvTxt" placeholder="date,title,amount"></textarea></label>
    <label>Conta<select id="csvConta">${S.listas.contas.map(c => `<option ${c === csvConta ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
    <div class="linha-bts"><button class="bt" onclick="analisarCSV()">Analisar</button><button type="button" class="bt sec" onclick="fecharModal()">Cancelar</button></div>`;
  } else {
    const n = e => L.filter(x => x.estado === e).length, sel = L.filter(x => x.sel), semCat = sel.filter(x => !x.cat).length;
    const opt = c => ['', ...S.listas.cats].map(o => `<option value="${esc(o)}" ${o === c ? 'selected' : ''}>${o ? esc(o) : '(sem categoria)'}</option>`).join('');
    const cls = { Novo: 'OK', Duplicado: 'ATENÇÃO', Pagamento: 'Manter' };
    corpo = `<p class="dica"><b>${L.length}</b> linhas em <b>${esc(csvConta)}</b>: ${n('Novo')} novas · ${n('Duplicado')} possíveis duplicadas (já existe lançamento igual) · ${n('Pagamento')} pagamentos/créditos${L.ignoradas ? ' · ' + L.ignoradas + ' linha(s) ignorada(s) sem data/valor' : ''}. Só as marcadas serão importadas${semCat ? ` · <b>${semCat} marcada(s) sem categoria</b>` : ''}.</p>
    <div class="rolar" style="max-height:52vh"><table class="tabela"><tr><th></th><th>Data</th><th>Descrição</th><th class="n">Valor</th><th>Categoria</th><th>Situação</th></tr>
    ${L.map((x, i) => `<tr><td><input type="checkbox" ${x.sel ? 'checked' : ''} onchange="csvSet(${i},'sel',this.checked)"></td><td>${dataBR(x.data).slice(0, 5)}</td><td>${esc(x.desc)}</td><td class="n ${cor(x.valor)}">${brl(x.valor)}</td><td><select onchange="csvSet(${i},'cat',this.value)">${opt(x.cat)}</select></td><td><span class="tag ${cls[x.estado]}">${x.estado}</span></td></tr>`).join('')}</table></div>
    <div class="linha-bts"><button class="bt" onclick="confirmarCSV()">Importar ${sel.length} selecionado(s) · ${brl(sel.reduce((a, x) => a + x.valor, 0))}</button><button class="bt sec" onclick="csvTodos(true)">Marcar todos</button><button class="bt sec" onclick="csvTodos(false)">Desmarcar todos</button><button class="bt sec" onclick="csvVoltar()">Voltar</button><button class="bt sec" onclick="fecharModal()">Cancelar</button></div>`;
  }
  $('modal').innerHTML = `<div class="modal" onclick="if(event.target===this)fecharModal()"><div class="caixa larga"><h2>Importar CSV da fatura</h2>${corpo}</div></div>`;
  const cx = document.querySelector('#modal .caixa'); if (cx) cx.scrollTop = sc;
}
function confirmarCSV() {
  const sel = csvLinhas.filter(x => x.sel); if (!sel.length) return alert('Nenhuma linha marcada.');
  const sem = sel.filter(x => !x.cat).length;
  if (sem && !confirm(sem + ' lançamento(s) estão sem categoria e não entrarão nos gastos por categoria. Importar assim mesmo?')) return;

function editor(nomeArr, campos, extras = () => []) {

function setOrc(cat, v) { let o = S.orc.find(x => x.cat === cat); if (!o) { o = { cat, valor: 0 }; S.orc.push(o); } o.valor = num(v); salvar(); render(); }

// ---------- REVISÃO DE GASTOS ----------
const DECISOES = ['Manter', 'Reduzir', 'Renegociar', 'Cancelar'];
function mesesHist() {
  const n = num(S.rev.meses); if (n > 0) return n;
  return Math.max(1, new Set(S.lanc.map(l => l.data.slice(0, 7))).size);
}
function revCalc(it) {
  const nome = (it.nome || '').trim().toLowerCase();
  if (!nome) return { oc: 0, mensal: 0, eco: 0 };
  const m = S.lanc.filter(l => l.desc.toLowerCase().startsWith(nome));
  const manual = it.manual !== '' && it.manual != null;
  const mensal = manual ? num(it.manual) : -m.reduce((a, l) => a + l.valor, 0) / mesesHist();
  const eco = it.dec === 'Cancelar' ? mensal : (it.dec === 'Reduzir' || it.dec === 'Renegociar') ? Math.max(0, mensal - num(it.alvo)) : 0;
  return { oc: m.length, mensal, eco };
}
const revEconomiaMensal = () => S.rev.itens.reduce((a, it) => a + revCalc(it).eco, 0);
let sugRev = [];
function sugestoesRev() {
  const ign = ['Pagamento de fatura', 'Transferência', 'Empréstimos'], g = {};
  S.lanc.filter(l => l.valor < 0 && !ign.includes(l.cat) && l.tipo !== 'Pagamento').forEach(l => {
    const k = l.desc.toLowerCase().replace(/[^a-z0-9]/g, ''); if (!k) return;
    const e = g[k] = g[k] || { descs: {}, meses: new Set(), n: 0, cat: l.cat };
    e.n++; e.meses.add(l.data.slice(0, 7)); e.descs[l.desc] = (e.descs[l.desc] || 0) + 1; e.cat = l.cat;
  });
  const usados = S.rev.itens.map(x => (x.nome || '').trim().toLowerCase()).filter(Boolean);
  return Object.values(g).filter(x => x.n >= 2 && x.meses.size >= 2).map(x => {
    const nome = Object.entries(x.descs).sort((a, b) => b[1] - a[1])[0][0];
    return { nome, cat: x.cat, ...revCalc({ nome }) };
  }).filter(x => !usados.some(u => x.nome.toLowerCase().startsWith(u))).sort((a, b) => b.mensal - a.mensal).slice(0, 10);
}
function revSet(i, k, v, t) { S.rev.itens[i][k] = t === 'n' ? numOuVazio(v) : v; salvar(); render(); }
function revDel(i) { if (!confirm('Remover este item?')) return; S.rev.itens.splice(i, 1); salvar(); render(); }

function revAddSug(i) { const s = sugRev[i]; S.rev.itens.push({ nome: s.nome, cat: s.cat, dec: 'Manter', alvo: '', manual: '', dif: '', prazo: '' }); salvar(); render(); }

// ---------- SIMULAÇÃO DE CENÁRIOS ----------
const faltaMensal = (L, alvo) => Math.max(0, ...L.map((l, i) => (alvo - l.fim) / (i + 1)));
function simulacao() {
  const P = projecao(), s = S.sim, reserva = num(S.cfg.reserva), econ = s.usarRev === 'Sim' ? revEconomiaMensal() : 0;
  let saldo = P.saldoIni;
  const linhas = P.linhas.map(b => {
    const rec = b.rec * (1 + num(s.reaj)) + num(s.extra);
    const gasto = Math.max(0, b.gasto * (1 - num(s.corte)) - econ);
    const aporte = s.aporteMes && chaveMes(b.mes) === s.aporteMes ? num(s.aporteValor) : 0;
    const res = rec - gasto - b.parc - b.fat + aporte, ini = saldo; saldo = ini + res;
    return { mes: b.mes, ini, rec, gasto, parc: b.parc, fat: b.fat, aporte, res, fim: saldo, base: b.fim, dif: saldo - b.fim, st: saldo < 0 ? 'NEGATIVO' : saldo < reserva ? 'ATENÇÃO' : 'OK' };
  });
  return { P, linhas, econ, final: saldo, menor: Math.min(...linhas.map(l => l.fim)), negativos: linhas.filter(l => l.fim < 0).length };
}
function simSet(k, v, t) { S.sim[k] = t === 'p' ? num(v) / 100 : t === 'n' ? num(v) : v; salvar(); render(); }
function aplicarNecessario(alvo) {
  S.sim.extra = 0;
  S.sim.extra = Math.ceil(faltaMensal(simulacao().linhas, alvo));
  salvar(); ir('sim');
}
// mostra pelo menos 12 meses e vai até 3 meses depois do último mês negativo (máx. 24)
function janelaGraf(...vals) { let u = -1; vals.forEach(v => v.forEach((x, i) => { if (x < 0) u = Math.max(u, i); })); return Math.min(24, Math.max(12, u + 4)); }
const marcoParcelas = L => { const u = L.map(l => l.parc > 0).lastIndexOf(true); return u >= 0 && u < L.length - 1 ? { i: u + 1, t: 'fim das parcelas' } : null; };
function grafLinhas(series, reserva, marcos = []) {
  const W = 700, H = 210, all = series.flatMap(s => s.v), n = series[0].v.length;
  const mn = Math.min(0, ...all), mx = Math.max(1, reserva, ...all);
  const x = i => 46 + i * (W - 58) / (n - 1), y = v => 12 + (H - 38) * (1 - (v - mn) / (mx - mn));
  const k = v => Math.abs(v) >= 1000 ? (v / 1000).toFixed(1).replace('.', ',') + 'k' : String(Math.round(v));
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">
    <line x1="46" x2="${W - 10}" y1="${y(0)}" y2="${y(0)}" stroke="#C8372D" stroke-dasharray="4"/>
    ${reserva > 0 ? `<line x1="46" x2="${W - 10}" y1="${y(reserva)}" y2="${y(reserva)}" stroke="#D99A00" stroke-dasharray="2"/>` : ''}
    <text x="2" y="${y(mx) + 4}">${k(mx)}</text><text x="2" y="${y(0) + 4}">0</text>${mn < 0 ? `<text x="2" y="${y(mn) + 4}">${k(mn)}</text>` : ''}
    ${series.map(s => `<polyline points="${s.v.map((v, i) => x(i) + ',' + y(v)).join(' ')}" fill="none" stroke="${s.cor}" stroke-width="2.5" ${s.trac ? 'stroke-dasharray="6 4"' : ''}/>${s.pontos ? s.v.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${v < 0 ? '#C8372D' : s.cor}"/>`).join('') : ''}`).join('')}
    ${marcos.filter(mc => mc && mc.i >= 0 && mc.i < n).map(mc => `<line x1="${x(mc.i)}" x2="${x(mc.i)}" y1="14" y2="${H - 26}" stroke="#7a8ca0" stroke-dasharray="3 3"/><text x="${x(mc.i)}" y="10" text-anchor="middle">${mc.t} · ${mesBR(series[0].m[mc.i])}</text>`).join('')}
    ${series[0].m.map((m, i) => i % 3 === 0 ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${mesBR(m)}</text>` : '').join('')}
  </svg>`;
}
function telaSim() {
  const R = simulacao(), s = S.sim, L = R.linhas, reserva = num(S.cfg.reserva), base = R.P;

// ---------- ROTA PARA SAIR DO VERMELHO (Painel) ----------
function rotaVermelho(p) {
  const L = p.linhas, res = num(S.cfg.reserva), econ = revEconomiaMensal();
  const neg = L.map((l, i) => l.fim < 0 ? i : -1).filter(i => i >= 0);
  const f0 = faltaMensal(L, 0), fr = faltaMensal(L, res);
  const ult = L.map(l => l.parc > 0).lastIndexOf(true);
  const libera = ult >= 0 && ult < 23 ? L[ult].parc - L[ult + 1].parc : 0;
  const nota = libera > 0 ? `<p class="dica">Em <b>${mesBR(L[ult + 1].mes)}</b> terminam as parcelas dos empréstimos e liberam <b>${brl(libera)}/mês</b>.</p>` : '';
  const nj = janelaGraf(L.map(l => l.fim)), Lj = L.slice(0, nj);
  const graf = `<p class="dica">Saldo previsto nos próximos ${nj} meses</p>` + grafLinhas([{ v: Lj.map(l => l.fim), m: Lj.map(l => l.mes), cor: '#2E5A73', pontos: true }], res, [marcoParcelas(L)]);
  if (!neg.length) return `<h2>Rota para sair do vermelho</h2><div class="card rota ok"><b class="pos">Nenhum mês no vermelho nos próximos 24 meses.</b>
    <p class="dica">Pior mês: ${brl(p.menor)}.${fr > 0 ? ` Para manter a reserva de ${brl(res)} em todos os meses faltam ${brl(fr)}/mês.` : ' A reserva mínima também é respeitada.'}</p>${nota}${graf}</div>`;
  const ultNeg = neg[neg.length - 1];
  const volta = ultNeg >= 23 ? 'Depois de 24 meses' : mesBR(L[ultNeg + 1].mes);
  const cobre = f0 > 0 ? Math.min(100, econ / f0 * 100) : 100;
  return `<h2>Rota para sair do vermelho</h2>
  <div class="card rota">
    <div class="grid" style="margin-bottom:10px">
      <div class="kpi"><div class="rot">Primeiro mês no vermelho</div><div class="val neg">${mesBR(L[neg[0]].mes)}</div><div class="det">${neg.length} mês(es) · pior saldo ${brl(p.menor)}</div></div>
      <div class="kpi"><div class="rot">Volta ao azul</div><div class="val">${volta}</div><div class="det">Último mês negativo: ${mesBR(L[ultNeg].mes)}</div></div>
      <div class="kpi"><div class="rot">Renda extra fixa necessária</div><div class="val warn">${brl(f0)}</div><div class="det">por mês, para nunca ficar abaixo de R$ 0 · ${brl(fr)} p/ manter a reserva</div></div>
      <div class="kpi"><div class="rot">Revisão de gastos</div><div class="val pos">${brl(econ)}</div><div class="det">${cobre.toFixed(0)}% do que falta · <a href="#" onclick="ir('rev');return false">revisar</a></div></div>
    </div>
    ${graf}${nota}
    <div class="linha-bts"><button class="bt" onclick="aplicarNecessario(0)">Simular a saída do vermelho</button><button class="bt sec" onclick="ir('rev')">Revisar gastos</button></div>
  </div>`;
}

// ---------- METAS ----------
const TIPOS_META = ['Reserva de emergência', 'Juntar valor', 'Quitar dívida', 'Renda extra mensal', 'Teto de gastos'];
const ehPoupanca = t => t === 'Reserva de emergência' || t === 'Juntar valor' || t === 'Quitar dívida';
const PRIO = { 'Alta': 0, 'Média': 1, 'Baixa': 2 };
const mesesEntre = (a, b) => (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth();
const TAGMETA = { 'Concluída': 'Concluida', 'No ritmo': 'NoRitmo', 'Atrasada': 'Atrasada', 'Em andamento': 'Andamento', 'Definir valor': 'Definir', 'OK': 'OK', 'ATENÇÃO': 'ATENÇÃO', 'ESTOURADO': 'ESTOURADO' };
const tagMeta = s => `<span class="tag ${TAGMETA[s] || ''}">${esc(s)}</span>`;
const gastoDividas = () => S.emprestimos.filter(e => e.inst).map(e => empCalc(e)).filter(c => c.sit === 'Em aberto').reduce((a, c) => a + c.saldo, 0);

// Sobra mensal que alimenta as metas: resultado projetado de cada mês + economia da Revisão de gastos.
function baseMetas() {
  const p = projecao();
  return { p, L: p.linhas, econ: revEconomiaMensal() };
}
// Simula 60 meses: a sobra de cada mês vai primeiro para os aportes fixos e depois, por prioridade e prazo, para as demais metas.
function simularMetas(base, extra = 0) {
  const L = base.L, mes0 = L[0].mes, N = 60;
  const cap = i => Math.max(0, L[Math.min(i, L.length - 1)].res + base.econ + extra);
  const gs = S.metas.filter(m => ehPoupanca(m.tipo)).map(m => {
    const alvo = num(m.alvo), atual = num(m.atual);
    return { m, alvo, atual, pz: m.prazo ? mesesEntre(mes0, iniMes(D(m.prazo))) : null, val: atual, serie: [atual], aloc: [], fim: (alvo > 0 && atual >= alvo) ? 0 : -1, manual: Math.max(0, num(m.aporte)), _a: 0 };
  });
  const ordem = [...gs].sort((a, b) => (PRIO[a.m.prio] ?? 1) - (PRIO[b.m.prio] ?? 1) || (a.pz ?? 999) - (b.pz ?? 999));
  const caps = [];
  for (let i = 0; i < N; i++) {
    let c = cap(i); caps.push(cap(i));
    ordem.forEach(g => { g._a = 0; });
    ordem.filter(g => g.alvo > 0 && g.val < g.alvo && g.manual > 0).forEach(g => { const a = Math.min(g.manual, c, g.alvo - g.val); g._a = a; c -= a; });
    ordem.filter(g => g.alvo > 0 && g.val < g.alvo && !(g.manual > 0)).forEach(g => { const a = Math.min(c, g.alvo - g.val); g._a = a; c -= a; });
    ordem.forEach(g => { g.val += g._a; g.aloc.push(g._a); g.serie.push(g.val); if (g.fim < 0 && g.alvo > 0 && g.val >= g.alvo - 0.005) g.fim = i; });
  }
  const capMedia = caps.slice(0, 12).reduce((a, b) => a + b, 0) / 12;
  return { gs, caps, capMedia, mes0 };
}
function metaInfo(g, mes0) {
  const falta = Math.max(0, g.alvo - g.atual), pct = g.alvo > 0 ? Math.min(1, g.atual / g.alvo) : 0;
  const prev = g.fim >= 0 ? addMes(mes0, g.fim) : null;
  const necessario = g.alvo > 0 && falta > 0 && g.pz != null ? falta / Math.max(1, g.pz + 1) : 0;
  let st;
  if (g.alvo <= 0) st = 'Definir valor'; else if (falta <= 0) st = 'Concluída';
  else if (g.pz != null) st = (g.fim >= 0 && g.fim <= g.pz) ? 'No ritmo' : 'Atrasada'; else st = 'Em andamento';
  return { falta, pct, prev, necessario, st };
}
// renda extra necessária (R$/mês) para todas as metas com prazo ficarem no ritmo; 0 = já cumpre; null = inalcançável
function extraNecessario(base) {
  const ok = x => simularMetas(base, x).gs.every(g => g.alvo <= 0 || g.pz == null || g.pz < 0 || g.alvo - g.atual <= 0 || (g.fim >= 0 && g.fim <= g.pz));
  if (ok(0)) return 0;
  let lo = 0, hi = 50000; if (!ok(hi)) return null;
  for (let i = 0; i < 20; i++) { const mid = (lo + hi) / 2; if (ok(mid)) hi = mid; else lo = mid; }
  return Math.ceil(hi / 10) * 10;
}
function tetoInfo(m) {
  const gasto = gastoCatMes(m.cat, iniMes(hoje())), media = mediaCategoria(m.cat), teto = num(m.alvo), pct = teto > 0 ? gasto / teto : 0;
  return { gasto, media, teto, pct, st: pct > 1 ? 'ESTOURADO' : pct >= 0.8 ? 'ATENÇÃO' : 'OK' };
}
const ritmoReal = m => { const ini = ISO(addMes(hoje(), -3)); return (m.hist || []).filter(h => h.data >= ini).reduce((a, h) => a + num(h.valor), 0) / 3; };

function insightsMetas(base, R, infos, extraNec) {
  const A = [], p = base.p;
  if (!S.metas.length) return A;
  if (p.negativos > 0) A.push({ n: 'neg', t: `A projeção tem ${p.negativos} mês(es) no vermelho. Nesses meses a sobra é zero e as metas de poupança não avançam; veja a Rota para sair do vermelho no Painel.` });
  const comPrazo = R.gs.filter((g, i) => g.alvo > 0 && g.pz != null && infos[i].falta > 0);
  if (comPrazo.length) {
    if (extraNec === null) A.push({ n: 'neg', t: 'Mesmo com R$ 50.000/mês extras os prazos atuais não fecham. Revise valores e prazos das metas.' });
    else if (extraNec > 0) A.push({ n: 'warn', t: `Para cumprir todos os prazos faltam cerca de ${brl(extraNec)}/mês (renda extra ou corte de gastos). A alternativa é adiar as metas atrasadas para a data prevista abaixo.` });
    else A.push({ n: '', t: 'Com a sobra projetada, todas as metas de poupança com prazo são cumpridas no prazo.' });
  }
  R.gs.forEach((g, i) => {
    const x = infos[i];
    if (x.st === 'Atrasada') A.push({ n: 'warn', t: `${g.m.nome}: previsão de conclusão ${x.prev ? mesBR(x.prev) : 'além de 5 anos'}, prazo ${mesBR(D(g.m.prazo))}.`, a: ['Ajustar', `abrirMeta('${g.m.id}')`] });
    const real = ritmoReal(g.m);
    if (real > 0 && x.necessario > 0 && real < x.necessario * 0.9) A.push({ n: 'warn', t: `${g.m.nome}: seu ritmo real nos últimos 3 meses é ${brl(real)}/mês, abaixo dos ${brl(x.necessario)}/mês necessários.` });
  });
  S.metas.filter(m => m.tipo === 'Teto de gastos' && m.cat && num(m.alvo) > 0).forEach(m => {
    const t = tetoInfo(m);
    if (t.media > t.teto) A.push({ n: 'warn', t: `${m.nome}: a média dos últimos 6 meses em ${m.cat} (${brl(t.media)}) está acima do teto de ${brl(t.teto)}. Cumprir o teto liberaria ${brl(t.media - t.teto)}/mês para as metas.` });
  });
  if (base.econ > 0) A.push({ n: '', t: `A economia da Revisão de gastos (${brl(base.econ)}/mês) já está somada à sobra usada nas metas.` });
  return A;
}

function miniMeta(g, mes0) {
  const W = 320, H = 130, pL = 6, pB = 18, pT = 12;
  const pz = g.pz != null ? Math.max(0, g.pz) : null;
  const n = Math.min(60, Math.max(6, (pz ?? 0) + 3, (g.fim >= 0 ? g.fim : 0) + 2));
  const ser = g.serie.slice(0, n + 1), top = (Math.max(g.alvo, ...ser) * 1.05) || 1;
  const x = i => pL + i * (W - pL - 8) / n, y = v => pT + (H - pT - pB) * (1 - v / top);
  const lab = i => `<text x="${x(i)}" y="${H - 4}" text-anchor="${i === 0 ? 'start' : i === n ? 'end' : 'middle'}">${mesBR(addMes(mes0, i))}</text>`;
  const pzi = pz != null ? Math.min(pz, n) : null;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução prevista da meta">
    <line x1="${pL}" x2="${W - 8}" y1="${y(g.alvo)}" y2="${y(g.alvo)}" stroke="#128361" stroke-dasharray="3 3"/>
    ${pzi != null ? `<line x1="${x(0)}" y1="${y(g.atual)}" x2="${x(pzi)}" y2="${y(g.alvo)}" stroke="#8A97A3" stroke-dasharray="4 3"/><line x1="${x(pzi)}" x2="${x(pzi)}" y1="${pT}" y2="${H - pB}" stroke="#b78119" stroke-dasharray="2 3"/><text x="${x(pzi)}" y="9" text-anchor="middle">prazo</text>` : ''}
    <polyline points="${ser.map((v, i) => x(i) + ',' + y(v)).join(' ')}" fill="none" stroke="#126b57" stroke-width="2.5"/>
    ${lab(0)}${n >= 12 ? lab(Math.round(n / 2)) : ''}${lab(n)}
  </svg><div class="leg"><span><i style="background:#126b57"></i>Previsto</span><span><i style="background:#8A97A3"></i>Ritmo necessário</span><span><i style="background:#128361"></i>Alvo</span></div>`;
}
function miniTeto(m) {
  const W = 320, H = 110, pB = 18, pT = 8, base = iniMes(hoje()), teto = num(m.alvo);
  const v = []; for (let i = 5; i >= 0; i--) { const d = addMes(base, -i); v.push({ d, v: gastoCatMes(m.cat, d) }); }
  const top = (Math.max(teto, ...v.map(a => a.v)) * 1.1) || 1, y = val => pT + (H - pT - pB) * (1 - val / top), bw = (W - 20) / 6;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gasto mensal da categoria contra o teto">
    ${v.map((a, i) => `<rect x="${10 + i * bw + bw * .18}" y="${y(Math.max(0, a.v))}" width="${bw * .64}" height="${Math.max(0, H - pB - y(Math.max(0, a.v)))}" rx="3" fill="${a.v > teto ? '#c34851' : '#208b72'}"/><text x="${10 + i * bw + bw / 2}" y="${H - 4}" text-anchor="middle">${mesBR(a.d)}</text>`).join('')}
    <line x1="6" x2="${W - 6}" y1="${y(teto)}" y2="${y(teto)}" stroke="#b78119" stroke-dasharray="4 3"/>
  </svg><div class="leg"><span><i style="background:#b78119"></i>Teto</span><span><i style="background:#208b72"></i>Dentro</span><span><i style="background:#c34851"></i>Acima</span></div>`;
}

function botoesMeta(m, extra = '') {
  return `<div class="linha-bts">${extra}<button class="bt sec" onclick="abrirMeta('${m.id}')">Editar</button><button class="bt sec" aria-label="Excluir meta" onclick="excluirMeta('${m.id}')">Excluir</button></div>`;
}
function cardPoupanca(g, x, mes0) {
  const m = g.m, real = ritmoReal(m);
  return `<div class="card meta"><div class="topo"><div><h3>${esc(m.nome)}</h3><div class="sub">${esc(m.tipo)} · prioridade ${esc(m.prio || 'Média')}</div></div>${tagMeta(x.st)}</div>
    <div class="pct">${(x.pct * 100).toFixed(0)}%</div><div class="trilho2"><i style="width:${x.pct * 100}%"></i></div>
    <dl><dt>Guardado</dt><dd>${brl(g.atual)} de ${brl(g.alvo)}</dd><dt>Falta</dt><dd>${brl(x.falta)}</dd>
    ${m.prazo ? `<dt>Prazo</dt><dd>${mesBR(D(m.prazo))}</dd><dt>Necessário por mês</dt><dd>${brl(x.necessario)}</dd>` : ''}
    <dt>Conclusão prevista</dt><dd>${x.falta <= 0 ? 'Concluída' : x.prev ? mesBR(x.prev) : 'além de 5 anos'}</dd>
    <dt>Aporte sugerido neste mês</dt><dd>${brl(g.aloc[0] || 0)}</dd>${real > 0 ? `<dt>Ritmo real (3 meses)</dt><dd>${brl(real)}/mês</dd>` : ''}</dl>
    ${g.alvo > 0 ? miniMeta(g, mes0) : ''}
    ${botoesMeta(m, `<button class="bt" onclick="aporteMeta('${m.id}')">+ Aporte</button>`)}</div>`;
}
function cardRenda(m) {
  const alvo = num(m.alvo), atual = num(m.atual), pct = alvo > 0 ? Math.min(1, atual / alvo) : 0;
  const st = atual >= alvo && alvo > 0 ? 'Concluída' : (m.prazo && D(m.prazo) < hoje()) ? 'Atrasada' : 'Em andamento';
  return `<div class="card meta"><div class="topo"><div><h3>${esc(m.nome)}</h3><div class="sub">${esc(m.tipo)}</div></div>${tagMeta(st)}</div>
    <div class="pct">${(pct * 100).toFixed(0)}%</div><div class="trilho2"><i style="width:${pct * 100}%"></i></div>
    <dl><dt>Renda atual por mês</dt><dd>${brl(atual)}</dd><dt>Meta por mês</dt><dd>${brl(alvo)}</dd><dt>Falta</dt><dd>${brl(Math.max(0, alvo - atual))}/mês</dd>${m.prazo ? `<dt>Prazo</dt><dd>${mesBR(D(m.prazo))}</dd>` : ''}<dt>Efeito em 12 meses</dt><dd>${brl(Math.max(0, alvo - atual) * 12)}</dd></dl>
    <p class="dica">Esta meta é um acompanhamento. Para a renda entrar na Projeção, cadastre-a em Receitas.</p>
    ${botoesMeta(m, `<button class="bt" onclick="aporteMeta('${m.id}')">Atualizar renda</button>`)}</div>`;
}
function cardTeto(m) {
  const t = tetoInfo(m), cls = t.st === 'ESTOURADO' ? 'acima' : t.st === 'ATENÇÃO' ? 'atenc' : '';
  return `<div class="card meta"><div class="topo"><div><h3>${esc(m.nome)}</h3><div class="sub">${esc(m.tipo)} · ${esc(m.cat)}</div></div>${tagMeta(t.st)}</div>
    <div class="pct">${(t.pct * 100).toFixed(0)}%</div><div class="trilho2"><i class="${cls}" style="width:${Math.min(100, t.pct * 100)}%"></i></div>
    <dl><dt>Gasto neste mês</dt><dd>${brl(t.gasto)}</dd><dt>Teto mensal</dt><dd>${brl(t.teto)}</dd><dt>Média dos últimos 6 meses</dt><dd>${brl(t.media)}</dd><dt>Média − teto</dt><dd class="${t.media > t.teto ? 'neg' : 'pos'}">${brl(t.media - t.teto)}</dd></dl>
    ${miniTeto(m)}
    ${botoesMeta(m, `<button class="bt" onclick="tetoComoOrcamento('${m.id}')">Usar como orçamento</button>`)}</div>`;
}

function telaMetas() {
  const base = baseMetas(), R = simularMetas(base, 0), infos = R.gs.map(g => metaInfo(g, R.mes0));
  const extraNec = extraNecessario(base), insights = insightsMetas(base, R, infos, extraNec);
  const rendas = S.metas.filter(m => m.tipo === 'Renda extra mensal'), tetos = S.metas.filter(m => m.tipo === 'Teto de gastos');
  const ativas = infos.filter(x => x.st !== 'Concluída').length + rendas.filter(m => num(m.atual) < num(m.alvo)).length + tetos.length;
  const concl = infos.filter(x => x.st === 'Concluída').length + rendas.filter(m => num(m.alvo) > 0 && num(m.atual) >= num(m.alvo)).length;
  const necTotal = infos.reduce((a, x) => a + x.necessario, 0);
  const somaAtual = R.gs.reduce((a, g) => a + Math.min(g.atual, g.alvo), 0), somaAlvo = R.gs.reduce((a, g) => a + g.alvo, 0);
  const cobertura = necTotal > 0 ? Math.min(999, R.capMedia / necTotal * 100) : 100;
  const bmax = Math.max(1, R.capMedia, necTotal, extraNec || 0);
  const barra = (n, v, cls = '') => `<div class="barra"><div class="nome" style="width:190px">${n}</div><div class="trilho"><div class="enche ${cls}" style="width:${Math.max(0, v) / bmax * 100}%"></div></div><div class="v">${brl(v)}</div></div>`;
  const cards = [...R.gs.map((g, i) => cardPoupanca(g, infos[i], R.mes0)), ...rendas.map(cardRenda), ...tetos.filter(m => m.cat).map(cardTeto)];
  const mesesTab = Array.from({ length: 12 }, (_, i) => i), gsAtivas = R.gs.filter(g => g.alvo > 0);
  $('tela').innerHTML = `
  <h2>Metas financeiras</h2>
  <div class="linha-bts" style="margin:0 0 16px"><button class="bt" onclick="abrirMeta()">+ Nova meta</button>${S.metas.length ? '' : '<button class="bt sec" onclick="sugerirMetas()">Sugerir metas a partir dos meus dados</button>'}</div>
  <div class="grid">
    <div class="card kpi"><div class="rot">Metas em andamento</div><div class="val">${ativas}</div><div class="det">${concl} concluída(s)</div></div>
    <div class="card kpi"><div class="rot">Sobra média por mês</div><div class="val ${cor(R.capMedia)}">${brl(R.capMedia)}</div><div class="det">Próximos 12 meses${base.econ > 0 ? ' · inclui ' + brl(base.econ) + ' da revisão de gastos' : ''}</div></div>
    <div class="card kpi"><div class="rot">Necessário por mês</div><div class="val">${brl(necTotal)}</div><div class="det">${necTotal > 0 ? 'Sobra cobre ' + cobertura.toFixed(0) + '% do necessário' : 'Para cumprir os prazos'}</div></div>
    <div class="card kpi"><div class="rot">Progresso das poupanças</div><div class="val pos">${somaAlvo > 0 ? (somaAtual / somaAlvo * 100).toFixed(0) + '%' : '—'}</div><div class="det">${brl(somaAtual)} de ${brl(somaAlvo)}</div></div>
  </div>
  ${insights.length ? `<h2>Análise</h2>${insights.map(a => `<div class="alerta ${a.n}"><span>${esc(a.t)}</span>${a.a ? `<button class="bt sec" onclick="${a.a[1]}">${a.a[0]}</button>` : ''}</div>`).join('')}` : ''}
  ${necTotal > 0 || extraNec ? `<h2>Sobra × necessário</h2><div class="card">${barra('Sobra média por mês', R.capMedia)}${barra('Necessário para os prazos', necTotal, necTotal > R.capMedia ? 'acima' : '')}${extraNec ? barra('Renda extra que fecha a conta', extraNec, 'acima') : ''}<p class="dica">A sobra é o resultado mensal da Projeção (receitas − gastos − parcelas − faturas), mês a mês. A renda extra necessária é calculada simulando 60 meses.</p></div>` : ''}
  <h2>Suas metas</h2>
  ${cards.length ? `<div class="metas-grid">${cards.join('')}</div>` : '<div class="card"><p>Nenhuma meta ainda. Crie uma reserva de emergência, um valor para juntar, uma dívida para quitar, uma meta de renda extra ou um teto de gastos por categoria.</p></div>'}
  ${gsAtivas.length ? `<h2>Como a sobra será distribuída (12 meses)</h2><div class="rolar"><table class="tabela"><tr><th>Mês</th><th class="n">Sobra</th>${gsAtivas.map(g => `<th class="n">${esc(g.m.nome)}</th>`).join('')}<th class="n">Sem destino</th></tr>
  ${mesesTab.map(i => { const usado = gsAtivas.reduce((a, g) => a + (g.aloc[i] || 0), 0); return `<tr><td>${mesBR(addMes(R.mes0, i))}</td><td class="n">${brl(R.caps[i])}</td>${gsAtivas.map(g => `<td class="n">${brl(g.aloc[i] || 0)}</td>`).join('')}<td class="n">${brl(R.caps[i] - usado)}</td></tr>`; }).join('')}</table></div>
  <p class="dica">A sobra de cada mês vai primeiro para os aportes fixos que você definiu e depois para as demais metas, por prioridade (Alta, Média, Baixa) e prazo. Nada aqui altera suas contas ou a Projeção.</p>` : ''}`;
}

// ---------- formulário de meta ----------

  if (!m) return;
  const opt = (arr, sel) => arr.map(x => `<option ${x === sel ? 'selected' : ''}>${esc(x)}</option>`).join('');
  $('modal').innerHTML = `<div class="modal" onclick="if(event.target===this)fecharModal()"><div class="caixa">
    <h2>${id ? 'Editar' : 'Nova'} meta</h2>
    <form onsubmit="salvarMeta(event,'${id || ''}')">
      <div class="campos">
        <label>Tipo<select id="mTipo" onchange="mostrarCamposMeta()">${opt(TIPOS_META, m.tipo)}</select></label>
        <label>Nome<input id="mNome" required maxlength="80" value="${esc(m.nome)}" placeholder="Ex.: Reserva de 6 meses"></label>
        <label data-g="s">Prioridade<select id="mPrio">${opt(['Alta', 'Média', 'Baixa'], m.prio || 'Média')}</select></label>
        <label data-g="t">Categoria<select id="mCat"><option value="">Selecione</option>${opt(S.listas.cats, m.cat)}</select></label>

function mostrarCamposMeta() {

function sugerirReserva(meses) {
  const parc = S.emprestimos.filter(e => e.inst && empCalc(e).sit === 'Em aberto').reduce((a, e) => a + num(e.parcela), 0);

function salvarMeta(ev, id) {

  if (g === 't' && !m.cat) return alert('Escolha a categoria do teto.');

function excluirMeta(id) { if (!confirm('Excluir esta meta? Lançamentos e contas não são afetados.')) return; S.metas = S.metas.filter(m => m.id !== id); salvar(); render(); }
function aporteMeta(id) {
  const m = S.metas.find(x => x.id === id); if (!m) return;
  if (m.tipo === 'Renda extra mensal') {
    const t = prompt('Renda extra atual por mês (R$):', String(num(m.atual)).replace('.', ',')); if (t === null) return;

  }
  const t = prompt('Valor do aporte (R$). Use valor negativo para retirada:', ''); if (t === null) return;

  m.atual = Math.max(0, r2(num(m.atual) + v)); m.hist = m.hist || []; m.hist.push({ data: ISO(hoje()), valor: v });

function sugerirMetas() {
  const novas = [], reserva = Math.round((gastoMedioTotal() + S.emprestimos.filter(e => e.inst && empCalc(e).sit === 'Em aberto').reduce((a, e) => a + num(e.parcela), 0)) * 6);
  if (reserva > 0) novas.push({ id: uid(), tipo: 'Reserva de emergência', nome: 'Reserva de 6 meses', alvo: reserva, atual: 0, prazo: ISO(addMes(hoje(), 12)), prio: 'Alta', aporte: '', cat: '', hist: [] });
  S.orc.filter(o => num(o.valor) > 0 && S.listas.cats.includes(o.cat)).map(o => ({ o, med: mediaCategoria(o.cat) })).sort((a, b) => b.med - a.med).slice(0, 3)

// ---------- SINCRONIZAÇÃO (Google Drive, pasta privada do app) ----------
// Os dados ficam num único arquivo na pasta "appDataFolder" do Drive: só este app enxerga, não aparece no seu Drive.
const SYNC_KEY = 'financas_sync_v1';
const GOOGLE_CLIENT_ID = ''; // opcional: preencha para não precisar colar o Client ID em cada aparelho
const SYNC_ARQ = 'movvaflow-dados.json';
const SYNC_ROT = { ok: 'sincronizado', trab: 'sincronizando…', pend: 'alterações pendentes', erro: 'erro ao sincronizar', auth: 'toque para sincronizar', off: '' };
let SY = lerSync(), syncEstado = 'off', syncMsg = '', syncTimer = null, syncOcupado = false, syncRepetir = false;
let syncToken = null, syncTokenAte = 0, syncTentativa = 0, syncPend = null, syncConflitoAberto = false;

function lerSync() {
  const v = { clientId: '', conectado: false, fileId: '', base: '', ultima: '' };
  try { return Object.assign(v, JSON.parse(localStorage.getItem(SYNC_KEY) || '{}')); } catch (e) { return v; }
}
function gravarSync() { try { localStorage.setItem(SYNC_KEY, JSON.stringify(SY)); } catch (e) {} }
const clientId = () => (SY.clientId || GOOGLE_CLIENT_ID || '').trim();
const tokenValido = () => !!syncToken && Date.now() < syncTokenAte - 60000;
function syncRotulo() { return SY.conectado && SYNC_ROT[syncEstado] ? ' · ☁ ' + SYNC_ROT[syncEstado] : ''; }
function textoRodape() { return APP_VERSION + ' · ' + (S.atualizado ? 'Salvo em ' + new Date(S.atualizado).toLocaleString('pt-BR') : 'Sem dados ainda') + syncRotulo(); }
function syncEstadoSet(e, msg) {
  syncEstado = e; syncMsg = msg || '';
  const el = $('atualizado'); if (el) el.textContent = textoRodape();
  const st = $('syncStatus'); if (st) st.innerHTML = syncStatusHTML();
}
function syncStatusHTML() {
  if (!SY.conectado) return 'Desconectado';
  const quando = SY.ultima ? ' · última: ' + new Date(SY.ultima).toLocaleString('pt-BR') : '';
  return '<b>' + esc(SYNC_ROT[syncEstado] || 'conectado') + '</b>' + esc(quando) + (syncMsg ? '<br><span class="neg">' + esc(syncMsg) + '</span>' : '');
}

function carregarGIS() {
  return new Promise((res, rej) => {
    if (window.google && google.accounts && google.accounts.oauth2) return res();
    const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = () => res(); s.onerror = () => rej(new Error('Não consegui carregar o login do Google. Verifique a internet.'));
    document.head.appendChild(s);
  });
}
function pedirToken() {
  if (tokenValido()) return Promise.resolve(syncToken);
  syncTentativa = Date.now();
  return carregarGIS().then(() => new Promise((res, rej) => {
    const tc = google.accounts.oauth2.initTokenClient({
      client_id: clientId(), scope: 'https://www.googleapis.com/auth/drive.appdata',
      callback: r => { if (r.error) return rej(Object.assign(new Error(r.error_description || r.error), { auth: r.error !== 'invalid_client' })); syncToken = r.access_token; syncTokenAte = Date.now() + (r.expires_in || 3600) * 1000; res(syncToken); },
      error_callback: e => rej(Object.assign(new Error('Login do Google não concluído (' + (e && e.type || 'bloqueado') + ')'), { auth: true }))
    });
    tc.requestAccessToken();
  }));
}
async function drive(path, opts = {}) {
  const t = await pedirToken();
  const r = await fetch('https://www.googleapis.com' + path, { ...opts, headers: { Authorization: 'Bearer ' + t, ...(opts.headers || {}) } });
  if (r.status === 401) { syncToken = null; throw Object.assign(new Error('Sessão do Google expirou'), { auth: true }); }
  if (!r.ok) throw Object.assign(new Error('Google Drive respondeu ' + r.status), { http: r.status });
  return r;
}
async function acharArquivo() {
  if (SY.fileId) return SY.fileId;
  const r = await drive('/drive/v3/files?spaces=appDataFolder&q=' + encodeURIComponent("name='" + SYNC_ARQ + "'") + '&fields=files(id,modifiedTime)&pageSize=10');
  const f = ((await r.json()).files || []).sort((a, b) => a.modifiedTime < b.modifiedTime ? 1 : -1)[0];
  if (f) { SY.fileId = f.id; gravarSync(); return f.id; }
  return '';
}
const lerNuvem = async id => (await drive('/drive/v3/files/' + id + '?alt=media')).json();
async function gravarNuvem(id) {
  const corpo = JSON.stringify({ ...S, versaoApp: APP_VERSION });
  if (id) { await drive('/upload/drive/v3/files/' + id + '?uploadType=media', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: corpo }); return id; }
  const b = 'mf' + uid(), meta = JSON.stringify({ name: SYNC_ARQ, parents: ['appDataFolder'] });
  const body = '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + meta + '\r\n--' + b + '\r\nContent-Type: application/json\r\n\r\n' + corpo + '\r\n--' + b + '--';
  const r = await drive('/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body });
  SY.fileId = (await r.json()).id; gravarSync(); return SY.fileId;
}
function aplicarNuvem(nuvem) {
  const n = Object.assign(estadoVazio(), nuvem); delete n.versaoApp;
  S = n; localStorage.setItem(KEY, JSON.stringify(S)); // direto: salvar() trocaria o carimbo de data
  SY.base = S.atualizado; gravarSync(); renderComFoco();
}
const resumoDados = d => (d.lanc || []).length + ' lançamentos, ' + (d.contas || []).length + ' contas, ' + (d.metas || []).length + ' metas';

async function syncAgora() {
  if (!SY.conectado || !clientId()) return;
  if (syncOcupado) { syncRepetir = true; return; }
  if (syncConflitoAberto) return;
  if (!navigator.onLine) return syncEstadoSet('pend', 'Sem internet; sincroniza quando voltar');
  syncOcupado = true; syncEstadoSet('trab');
  try {
    let id = await acharArquivo(), nuvem = null;
    if (id) { try { nuvem = await lerNuvem(id); } catch (e) { if (e.http === 404) { SY.fileId = ''; gravarSync(); id = ''; } else throw e; } }
    const loc = S.atualizado || '', rem = (nuvem && nuvem.atualizado) || '', base = SY.base || '';
    if (!nuvem) { if (loc) { await gravarNuvem(''); SY.base = loc; } }
    else if (!loc) aplicarNuvem(nuvem);                       // aparelho vazio nunca sobrescreve a nuvem
    else if (loc === rem) SY.base = loc;
    else if (loc !== base && rem !== base) { syncPend = nuvem; syncEstadoSet('pend'); abrirConflito(); return; }
    else if (rem !== base) aplicarNuvem(nuvem);
    else { await gravarNuvem(id); SY.base = loc; }
    SY.ultima = new Date().toISOString(); gravarSync(); syncEstadoSet('ok');
  } catch (e) {
    if (e.auth) syncEstadoSet('auth', e.message); else syncEstadoSet('erro', e.message);
  } finally {
    syncOcupado = false;
    if (syncRepetir) { syncRepetir = false; agendarSync(); }
  }
}
function agendarSync() {
  if (!SY.conectado || !clientId()) return;
  syncEstadoSet('pend'); clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncAgora(), 3000);
}

// ---------- conflito: os dois lados mudaram ----------
function abrirConflito() {
  syncConflitoAberto = true;
  const quando = d => d.atualizado ? new Date(d.atualizado).toLocaleString('pt-BR') : 'sem data';
  $('modal').innerHTML = `<div class="modal"><div class="caixa" data-nosync>
    <h2>Dados diferentes neste aparelho e na nuvem</h2>
    <p class="dica">Os dois foram alterados desde a última sincronização. Escolha qual manter; o outro será descartado.</p>
    <div class="card"><b>Este aparelho</b><br>${resumoDados(S)}<br>salvo em ${quando(S)}<div class="linha-bts"><button class="bt sec" onclick="baixarJSON(S,'financas-deste-aparelho.json')">Baixar cópia</button><button class="bt" onclick="resolverConflito('local')">Manter este aparelho</button></div></div>
    <div class="card"><b>Nuvem (Google Drive)</b><br>${resumoDados(syncPend)}<br>salvo em ${quando(syncPend)}<div class="linha-bts"><button class="bt sec" onclick="baixarJSON(syncPend,'financas-da-nuvem.json')">Baixar cópia</button><button class="bt" onclick="resolverConflito('nuvem')">Usar a nuvem</button></div></div>
    <div class="linha-bts"><button class="bt sec" onclick="resolverConflito('depois')">Decidir depois</button></div>
  </div></div>`;
}
async function resolverConflito(qual) {
  const nuvem = syncPend; syncConflitoAberto = false; fecharModal();
  if (qual === 'depois') { syncEstadoSet('pend', 'Conflito pendente: abra Configurações › Sincronização'); return; }
  syncPend = null;
  if (qual === 'nuvem') { aplicarNuvem(nuvem); SY.ultima = new Date().toISOString(); gravarSync(); syncEstadoSet('ok'); return; }
  try { syncOcupado = true; syncEstadoSet('trab'); await gravarNuvem(SY.fileId || ''); SY.base = S.atualizado; SY.ultima = new Date().toISOString(); gravarSync(); syncEstadoSet('ok'); }
  catch (e) { syncEstadoSet(e.auth ? 'auth' : 'erro', e.message); } finally { syncOcupado = false; }
}
function baixarJSON(obj, nome) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 1)], { type: 'application/json' })); a.download = nome; a.click();
}

async function conectarSync() {
  const v = ($('syncCid').value || '').trim();

function desconectarSync() {

  <p class="dica" style="margin-top:14px"><b>Sobrescrever premissas da projeção</b> (deixe vazio para calcular sozinho):</p>
  <div style="display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
    ${campo('Mês inicial (vazio = mês atual)', 'pj', 'mesInicial', 'date')}${campo('Saldo inicial', 'pj', 'saldo')}${campo('Receita líquida mensal', 'pj', 'receita')}${campo('Gasto mensal', 'pj', 'gasto')}${campo('Parcelas por mês', 'pj', 'parcelas')}${campo('Fatura por mês', 'pj', 'fatura')}
  </div></div>
  <h2>Regras de categoria</h2>
  <p class="dica">Se a descrição contém a palavra-chave, a categoria é preenchida sozinha. Vale a ÚLTIMA regra encontrada (as de baixo têm prioridade).</p>
  ${editor('regras', [['k', 'Palavra-chave', 't'], ['cat', 'Categoria', S.listas.cats], ['tipo', 'Tipo', S.listas.tipos]])}
  <h2>Listas</h2>
  <div class="card"><div style="display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
    ${[['cats', 'Categorias'], ['contas', 'Contas (inclua o cartão)'], ['meios', 'Meios de pagamento'], ['tipos', 'Tipos de lançamento']].map(([k, r]) => `<div><label>${r} (uma por linha)<textarea onchange="S.listas.${k}=this.value.split('\\n').map(s=>s.trim()).filter(Boolean);salvar();render()">${esc(S.listas[k].join('\n'))}</textarea></label></div>`).join('')}
  </div></div>
  ${cardSync()}
  <h2>Backup</h2>
  <div class="card">
    <p class="dica">Versão do app: <b>${APP_VERSION}</b> (${APP_BUILD}) · Último backup: <b>${S.ultimoBackup ? dataBR(S.ultimoBackup) : 'nunca'}</b></p>
    <p class="dica">Sem a sincronização ligada, os dados ficam salvos só neste navegador. Este backup serve de cópia de segurança (ou para levar dados sem usar o Google).</p>
    <div class="linha-bts"><button class="bt" onclick="exportarBackup()">Exportar backup (.json)</button>
    <label class="bt sec" style="display:inline-block;color:var(--azul);font-size:14px">Importar backup<input type="file" accept=".json" style="display:none" onchange="importarBackup(this.files[0])"></label>
    <button class="bt perigo" onclick="if(confirm(SY.conectado?'Apagar os dados DESTE aparelho? A cópia na nuvem continua e volta na próxima sincronização. Para apagar tudo, desconecte a sincronização antes.':'Apagar TODOS os dados do app?')){localStorage.removeItem(KEY);S=estadoVazio();render()}">Apagar tudo</button></div>
  </div>`;
}
function fazerImport() {
  try { const n = importarTexto($('txtImport').value); toast(n + ' lançamentos importados'); ir('painel'); }
  catch (e) { alert(e.message); }
}
function exportarBackup() {
  S.ultimoBackup = ISO(hoje()); salvar();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ ...S, versaoApp: APP_VERSION }, null, 1)], { type: 'application/json' }));
  a.download = 'financas-backup-' + ISO(hoje()) + '.json'; a.click();
  render();
}
function importarBackup(file) {
  if (!file) return; const r = new FileReader();
  r.onload = () => { try { S = Object.assign(estadoVazio(), JSON.parse(r.result)); salvar(); toast('Backup importado'); ir('painel'); } catch (e) { alert('Arquivo inválido.'); } };
  r.readAsText(file);
}

render();
</script>

<script>
function aplicarFundo(pausado){
  document.body.classList.toggle('fundo-pausado',pausado);
  const b=document.getElementById('bgToggle');
  b.textContent=pausado?'Animar fundo':'Pausar fundo';
  b.setAttribute('aria-pressed',String(pausado));
  b.setAttribute('aria-label',pausado?'Retomar animação do fundo':'Pausar animação do fundo');
}
function alternarFundo(){
  const pausado=!document.body.classList.contains('fundo-pausado');
  aplicarFundo(pausado);
  try{localStorage.setItem('financas_visual_fundo_pausado',String(pausado));}catch(e){}
}
try{aplicarFundo(localStorage.getItem('financas_visual_fundo_pausado')==='true');}catch(e){}
</script>
</body>
</html>
